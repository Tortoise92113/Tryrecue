user_name: "Your Name"

search:
  keywords:
    - waiter
    - barista
    - kitchen hand
    - cafe
    - restaurant
    - hotel housekeeping
    - front desk
    - assistant
  cities:
    - Cairns
    - Darwin
    - Townsville
    - Broome
    - Alice Springs
  max_results_per_query: 50

adzuna:
  app_id: YOUR_ADZUNA_APP_ID
  app_key: YOUR_ADZUNA_APP_KEY

backpacker_job_board:
  enabled: true
  max_results: 100

gemini:
  api_key: YOUR_GEMINI_API_KEY
  model: gemini-2.5-flash

email:
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender: your_email@gmail.com
  app_password: YOUR_GMAIL_APP_PASSWORD
  recipients:
    - recipient@gmail.com

schedule:
  run_time: "10:00"
  timezone: "Australia/Darwin"

jora_scraping: true

filters:
  exclude_urgent: false  # 設 true 可過濾 urgency=high 的職缺

  # 職缺「標題」含有以下任一關鍵字就會在抓取後、分類前被丟掉（不分大小寫，整字比對）。
  # 片語可用空白分隔（例如 "farm manager" 會比對連續的 farm + manager）。留空 [] = 不封鎖。
  title_block:
    - senior
    - chef
    - farmer
    - farming
    - farm manager
    - farm hand
    - farm worker
    - farm assistant
    - agricultural
    - agriculture

  # 職缺「地點」封鎖關鍵字；留空 [] 代表不封鎖任何地點。
  location_block: []
