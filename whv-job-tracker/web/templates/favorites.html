<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的收藏 — WHV Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #222;
      padding-top: 53px;
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #1a73e8;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    #top-bar h1 { font-size: 1.15rem; font-weight: 600; }
    #back-link {
      margin-left: auto;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.12s;
    }
    #back-link:hover { color: #fff; }

    #body { height: calc(100vh - 53px); display: flex; overflow: hidden; }

    #sidebar {
      width: 180px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px 0;
    }
    .sidebar-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0 16px 10px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      text-decoration: none;
      border-left: 3px solid transparent;
      font-size: 0.9rem;
      color: #555;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover { background: #f0f4f8; color: #222; }
    .nav-btn.active {
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 600;
      border-left-color: #1a73e8;
    }

    #content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Stats bar */
    #stats-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stat-chip {
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 16px;
      padding: 5px 14px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .stat-chip.green { background: #e6f4ea; color: #188038; }
    .stat-chip.teal  { background: #e0f2f1; color: #00796b; }
    #page-info { margin-left: auto; font-size: 0.88rem; color: #666; }

    /* Table */
    #table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    #fav-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    #fav-table thead tr {
      background: #f8fafc;
      border-bottom: 2px solid #e8ecf0;
    }
    #fav-table th {
      padding: 11px 14px;
      text-align: left;
      font-size: 0.94rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    #fav-table tbody tr {
      border-bottom: 1px solid #f0f4f8;
      transition: background 0.1s;
    }
    #fav-table tbody tr:last-child { border-bottom: none; }
    #fav-table tbody tr:hover { background: #f8fafc; }
    #fav-table td { padding: 11px 14px; vertical-align: middle; color: #444; }
    .td-title a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 500;
    }
    .td-title a:hover { text-decoration: underline; }
    .no-data { color: #bbb; font-style: italic; }
    .text-muted { color: #bbb; }
    .empty-row { text-align: center; padding: 40px; color: #aaa; }
    .tag-chip {
      display: inline-block;
      background: #f1f3f4;
      color: #555;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.78rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.78rem;
      border-radius: 10px;
      padding: 2px 8px;
      white-space: nowrap;
      font-weight: 500;
    }
    .badge-yes     { background: #e6f4ea; color: #188038; }
    .badge-no      { background: #fce8e6; color: #c5221f; }
    .badge-unknown { background: #f1f3f4; color: #777; }
    .source-chip {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .favorited-at { color: #aaa; font-size: 0.82rem; white-space: nowrap; }

    .btn-unfav {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      color: #F7D154;
      line-height: 1;
      padding: 0 4px;
      transition: transform 0.12s;
    }
    .btn-unfav:hover { transform: scale(1.25); }

    /* Pagination */
    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #page-label { font-size: 0.88rem; color: #666; min-width: 60px; text-align: center; }
    .page-btn {
      padding: 7px 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .page-btn:hover:not(:disabled) { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div id="top-bar">
  <h1>★ 我的收藏</h1>
  <a href="/" id="back-link">← 回主頁</a>
</div>

<div id="body">
  <aside id="sidebar">
    <div class="sidebar-title">導覽</div>
    <a class="nav-btn" href="/">🦘 職缺列表</a>
    <a class="nav-btn active" href="/favorites">★ 我的收藏</a>
    <a class="nav-btn" href="/analysis">📊 工作分析</a>
    <a class="nav-btn" href="/deleted">🗑 待刪除清單</a>
  </aside>

  <main id="content">
    <div id="stats-bar">
      <span class="stat-chip" id="stat-total">—</span>
      <span class="stat-chip green" id="stat-whv">—</span>
      <span class="stat-chip teal" id="stat-regional">—</span>
      <span id="page-info"></span>
    </div>

    <div id="table-wrap">
      <table id="fav-table">
        <thead>
          <tr>
            <th>職缺名稱</th>
            <th>公司</th>
            <th>地區</th>
            <th>工作類別</th>
            <th>薪資</th>
            <th>WHV</th>
            <th>可集簽</th>
            <th>來源</th>
            <th>收藏時間</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="fav-tbody">
          <tr><td colspan="10" class="empty-row">載入中…</td></tr>
        </tbody>
      </table>
    </div>

    <div id="pagination">
      <button class="page-btn" id="btn-prev" disabled>上一頁</button>
      <span id="page-label">—</span>
      <button class="page-btn" id="btn-next" disabled>下一頁</button>
    </div>
  </main>
</div>

<script>
const PER_PAGE = 20;
const SOURCE_LABELS = { adzuna: 'Adzuna', workforce_australia: 'Workforce AU', jora: 'Jora' };
const TYPE_LABELS   = {
  hospitality: '餐飲/服務', hotel: '飯店/住宿', office: '行政/辦公',
  retail: '零售', other: '其他', farm: '農業/農場', unknown: '未分類',
};

let allJobs = [];
let page    = 1;

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatSalary(min, max) {
  if (!min && !max) return '<span class="no-data">未標示</span>';
  const fmt = n => '$' + Number(n).toLocaleString();
  if (min && max) return `${fmt(min)} – ${fmt(max)}`;
  return fmt(min || max);
}

function whvBadge(val) {
  if (val === 1)  return '<span class="badge badge-yes">✅ 是</span>';
  if (val === 0)  return '<span class="badge badge-no">❌ 否</span>';
  return '<span class="badge badge-unknown">？ 未知</span>';
}

function regionalBadge(val) {
  return val === 1 ? '<span class="badge badge-yes">✅ 是</span>' : '<span class="text-muted">—</span>';
}

function formatFavoritedAt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}

function updateStats() {
  document.getElementById('stat-total').textContent    = `共收藏 ${allJobs.length} 筆`;
  document.getElementById('stat-whv').textContent      = `WHV 接受 ${allJobs.filter(j => j.is_whv_friendly === 1).length} 筆`;
  document.getElementById('stat-regional').textContent = `可集簽 ${allJobs.filter(j => j.regional_area === 1).length} 筆`;
}

function renderTable() {
  const total      = allJobs.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  const start      = (page - 1) * PER_PAGE;
  const pageJobs   = allJobs.slice(start, start + PER_PAGE);

  document.getElementById('page-info').textContent  = `第 ${page} 頁，共 ${total} 筆`;
  document.getElementById('page-label').textContent = `${page} / ${totalPages}`;
  document.getElementById('btn-prev').disabled = page <= 1;
  document.getElementById('btn-next').disabled = page >= totalPages;

  const tbody = document.getElementById('fav-tbody');
  if (!pageJobs.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="empty-row">尚無收藏的職缺 ★</td></tr>';
    return;
  }

  tbody.innerHTML = pageJobs.map(j => `
    <tr>
      <td class="td-title">
        <a href="${escHtml(j.url || '#')}" target="_blank" rel="noopener">${escHtml(j.title)}</a>
      </td>
      <td>${escHtml(j.company || '—')}</td>
      <td>${escHtml(j.city || j.location || '—')}</td>
      <td>${j.job_type ? `<span class="tag-chip">${escHtml(TYPE_LABELS[j.job_type] ?? j.job_type)}</span>` : '—'}</td>
      <td>${formatSalary(j.salary_min, j.salary_max)}</td>
      <td>${whvBadge(j.is_whv_friendly)}</td>
      <td>${regionalBadge(j.regional_area)}</td>
      <td><span class="source-chip">${escHtml(SOURCE_LABELS[j.source] ?? j.source ?? '—')}</span></td>
      <td class="favorited-at">${formatFavoritedAt(j.favorited_at)}</td>
      <td>
        <button class="btn-unfav" data-job-id="${escHtml(j.id)}" title="取消收藏">★</button>
      </td>
    </tr>
  `).join('');

  document.querySelectorAll('.btn-unfav').forEach(btn => {
    btn.addEventListener('click', async () => {
      const jobId = btn.dataset.jobId;
      await fetch(`/api/jobs/${jobId}/favorite`, { method: 'POST' });
      allJobs = allJobs.filter(j => j.id !== jobId);
      if (page > Math.max(1, Math.ceil(allJobs.length / PER_PAGE))) page--;
      updateStats();
      renderTable();
    });
  });
}

document.getElementById('btn-prev').addEventListener('click', () => { page--; renderTable(); });
document.getElementById('btn-next').addEventListener('click', () => { page++; renderTable(); });

async function init() {
  allJobs = await fetch('/api/jobs/favorites').then(r => r.json());
  updateStats();
  renderTable();
}
init();
</script>

</body>
</html>
