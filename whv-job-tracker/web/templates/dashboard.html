<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHV Tracker — 發信面板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial,sans-serif;color:#222;background:#f0f4f8;min-height:100vh}
.hdr{background:#1a73e8;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px}
.hdr h1{font-size:1.25rem;font-weight:600}
.back{margin-left:auto;color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.85rem;
      background:rgba(255,255,255,0.15);border-radius:8px;padding:5px 13px;
      transition:background 0.15s}
.back:hover{background:rgba(255,255,255,0.25);color:#fff}
.main{max-width:740px;margin:28px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:22px 24px;
      box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:18px}
.card h2{font-size:.95rem;color:#444;margin-bottom:14px;font-weight:600}
.row{display:flex;gap:10px;align-items:stretch}
input[type=email]{
  flex:1;padding:10px 14px;font-size:1rem;
  border:1px solid #ddd;border-radius:7px;outline:none}
input[type=email]:focus{border-color:#1a73e8;box-shadow:0 0 0 3px #e8f0fe}
#btn{
  padding:10px 26px;background:#1a73e8;color:#fff;
  border:none;border-radius:7px;font-size:1rem;cursor:pointer;white-space:nowrap}
#btn:hover:not(:disabled){background:#1557b0}
#btn:disabled{background:#aaa;cursor:not-allowed}
#log{
  background:#0d1117;color:#a8ff78;font-family:'Courier New',monospace;
  font-size:.82rem;line-height:1.65;padding:16px 18px;
  border-radius:8px;height:440px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-all;border:2px solid transparent;
  transition:border-color .3s}
#log.done {border-color:#34a853}
#log.error{border-color:#ea4335;color:#ff6b6b}
#badge{
  display:inline-block;margin-top:10px;padding:4px 13px;
  border-radius:12px;font-size:.8rem;font-weight:600;background:#f0f4f8;color:#666}
#badge.run {background:#fff3cd;color:#856404}
#badge.done{background:#d4edda;color:#155724}
#badge.err {background:#f8d7da;color:#721c24}
.scope-group{display:flex;gap:0;margin-top:14px}
.scope-btn{
  flex:1;padding:8px 0;font-size:.88rem;font-weight:600;cursor:pointer;
  border:1px solid #ddd;background:#f8f9fa;color:#555;transition:background .15s,color .15s}
.scope-btn:first-child{border-radius:7px 0 0 7px}
.scope-btn:last-child {border-radius:0 7px 7px 0;border-left:none}
.scope-btn.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
</style>
</head>
<body>
<div class="hdr">
  <h1>&#x1F998; WHV Tracker — 發信面板</h1>
  <a href="/" class="back">← 回主頁</a>
</div>
<div class="main">
  <div class="card">
    <h2>收件 Email</h2>
    <div class="row">
      <input type="email" id="email" placeholder="your@email.com">
      <button id="btn" onclick="start()">發信</button>
    </div>
    <div class="scope-group">
      <button class="scope-btn active" id="scope-today" onclick="setScope('today')">📅 今天的職缺</button>
      <button class="scope-btn" id="scope-all" onclick="setScope('all')">🗄 整個資料庫</button>
    </div>
  </div>
  <div class="card">
    <h2>執行進度 <span id="badge">待機</span></h2>
    <div id="log">點擊「發信」開始執行...</div>
  </div>
</div>
<script>
var poll=null;
var scope='today';

function setScope(s){
  scope=s;
  document.getElementById('scope-today').className='scope-btn'+(s==='today'?' active':'');
  document.getElementById('scope-all').className='scope-btn'+(s==='all'?' active':'');
}

async function start(){
  var em=document.getElementById('email').value.trim();
  if(!em.includes('@')){alert('請輸入包含 @ 的 email 地址');return;}
  var btn=document.getElementById('btn');
  var log=document.getElementById('log');
  var badge=document.getElementById('badge');
  btn.disabled=true;
  log.textContent='';
  log.className='';
  badge.textContent='執行中...';
  badge.className='run';
  if(poll)clearInterval(poll);
  try{
    var r=await fetch('/dashboard/send-report',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:em,scope:scope})
    });
    var d=await r.json();
    if(r.ok&&d.status==='started'){
      poll=setInterval(check,2000);
    }else{
      log.textContent='錯誤：'+(d.error||'未知錯誤');
      log.className='error';
      badge.textContent='失敗';badge.className='err';
      btn.disabled=false;
    }
  }catch(e){
    log.textContent='連線錯誤：'+e;
    log.className='error';
    btn.disabled=false;
  }
}

async function check(){
  try{
    var r=await fetch('/dashboard/status');
    var d=await r.json();
    var log=document.getElementById('log');
    var badge=document.getElementById('badge');
    if(d.logs&&d.logs.length){
      log.textContent=d.logs.join('\n');
      log.scrollTop=log.scrollHeight;
    }
    if(d.done){
      clearInterval(poll);
      document.getElementById('btn').disabled=false;
      if(d.error){
        log.className='error';
        badge.textContent='❌ 失敗';badge.className='err';
      }else{
        log.className='done';
        badge.textContent='✅ 完成';badge.className='done';
      }
    }
  }catch(e){console.warn('status check:',e);}
}
</script>
</body>
</html>
