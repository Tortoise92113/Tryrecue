<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待刪除清單 — WHV Job Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #222;
      padding-top: 53px;
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #1a73e8;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    #top-bar h1 { font-size: 1.15rem; font-weight: 600; }
    #back-link {
      margin-left: auto;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.12s;
    }
    #back-link:hover { color: #fff; }

    #body { height: calc(100vh - 53px); display: flex; overflow: hidden; }

    #sidebar {
      width: 180px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 16px 0;
    }
    .sidebar-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0 16px 10px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      text-decoration: none;
      border-left: 3px solid transparent;
      font-size: 0.9rem;
      color: #555;
      transition: background 0.12s, color 0.12s;
    }
    .nav-btn:hover { background: #f0f4f8; color: #222; }
    .nav-btn.active {
      background: #e8f0fe;
      color: #1a73e8;
      font-weight: 600;
      border-left-color: #1a73e8;
    }

    #content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #action-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    #btn-confirm-delete {
      background: #E8637A;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #btn-confirm-delete:hover:not(:disabled) { background: #d44f67; }
    #btn-confirm-delete:disabled { opacity: 0.45; cursor: default; }
    #page-info { font-size: 0.88rem; color: #666; margin-left: auto; }

    #table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    #del-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    #del-table thead tr {
      background: #f8fafc;
      border-bottom: 2px solid #e8ecf0;
    }
    #del-table th {
      padding: 11px 14px;
      text-align: left;
      font-size: 0.94rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    #del-table tbody tr {
      border-bottom: 1px solid #f0f4f8;
      transition: background 0.1s;
    }
    #del-table tbody tr:last-child { border-bottom: none; }
    #del-table tbody tr:hover { background: #f8fafc; }
    #del-table td { padding: 11px 14px; vertical-align: middle; color: #444; }
    .empty-row { text-align: center; padding: 40px; color: #aaa; }
    .deleted-at { color: #aaa; font-size: 0.82rem; white-space: nowrap; }
    .tag-chip {
      display: inline-block;
      background: #f1f3f4;
      color: #555;
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.78rem;
    }

    .btn-restore {
      background: none;
      border: 1px solid #5BC8A0;
      color: #5BC8A0;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-restore:hover { background: #e8f8f3; }

    .btn-purge {
      background: none;
      border: 1px solid #E8637A;
      color: #E8637A;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .btn-purge:hover { background: #fce8ed; }

    #pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #page-label { font-size: 0.88rem; color: #666; min-width: 60px; text-align: center; }
    .page-btn {
      padding: 7px 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .page-btn:hover:not(:disabled) { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
    .page-btn:disabled { opacity: 0.4; cursor: default; }

    /* Modal */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.38);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.show { display: flex; }
    #modal-box {
      background: #fff;
      border-radius: 14px;
      padding: 32px 36px;
      box-shadow: 0 8px 36px rgba(0,0,0,0.18);
      min-width: 300px;
      text-align: center;
    }
    #modal-msg { font-size: 1rem; font-weight: 600; color: #222; margin-bottom: 6px; }
    #modal-hint { font-size: 0.8rem; color: #888; margin-bottom: 24px; }
    .modal-btns { display: flex; gap: 12px; justify-content: center; }
    #modal-yes {
      background: #E8637A; color: #fff; border: none;
      border-radius: 8px; padding: 9px 28px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    #modal-yes:hover { background: #d44f67; }
    #modal-noo {
      background: #fff; color: #555; border: 1px solid #ccc;
      border-radius: 8px; padding: 9px 28px;
      font-size: 0.9rem; cursor: pointer;
      transition: background 0.12s;
    }
    #modal-noo:hover { background: #f1f3f4; }
  </style>
</head>
<body>

<div id="top-bar">
  <h1>🗑 待刪除清單</h1>
  <a href="/" id="back-link">← 回主頁</a>
</div>

<div id="body">
  <aside id="sidebar">
    <div class="sidebar-title">導覽</div>
    <a class="nav-btn" href="/">🦘 職缺列表</a>
    <a class="nav-btn" href="/favorites">★ 我的收藏</a>
    <a class="nav-btn" href="/analysis">📊 工作分析</a>
    <a class="nav-btn active" href="/deleted">🗑 待刪除清單</a>
  </aside>

  <main id="content">
    <div id="action-bar">
      <button id="btn-confirm-delete" disabled>確認刪除選取項目</button>
      <span id="page-info"></span>
    </div>

    <div id="table-wrap">
      <table id="del-table">
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" id="select-all" /></th>
            <th>職缺名稱</th>
            <th>所在地區</th>
            <th>工作類別</th>
            <th>標記刪除時間</th>
            <th>還原</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="del-tbody">
          <tr><td colspan="7" class="empty-row">載入中…</td></tr>
        </tbody>
      </table>
    </div>

    <div id="pagination">
      <button class="page-btn" id="btn-prev" disabled>上一頁</button>
      <span id="page-label">—</span>
      <button class="page-btn" id="btn-next" disabled>下一頁</button>
    </div>
  </main>
</div>

<!-- Confirm modal -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-msg">Are you sure?</div>
    <div id="modal-hint"></div>
    <div class="modal-btns">
      <button id="modal-yes">Yes</button>
      <button id="modal-noo">Noo</button>
    </div>
  </div>
</div>

<script>
const TYPE_LABELS = {
  hospitality: '餐飲/服務', hotel: '飯店/住宿', office: '行政/辦公',
  retail: '零售', other: '其他', farm: '農業/農場', unknown: '未分類',
};

const PER_PAGE = 20;
let allJobs = [];
let page = 1;

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDeletedAt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}

function selectedIds() {
  return [...document.querySelectorAll('.row-check:checked')].map(cb => cb.dataset.jobId);
}

function updateDeleteBtn() {
  document.getElementById('btn-confirm-delete').disabled = selectedIds().length === 0;
}

function renderTable() {
  const total = allJobs.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  const start = (page - 1) * PER_PAGE;
  const pageJobs = allJobs.slice(start, start + PER_PAGE);

  document.getElementById('page-info').textContent  = `第 ${page} 頁，共 ${total} 筆`;
  document.getElementById('page-label').textContent = `${page} / ${totalPages}`;
  document.getElementById('btn-prev').disabled = page <= 1;
  document.getElementById('btn-next').disabled = page >= totalPages;
  document.getElementById('select-all').checked = false;
  updateDeleteBtn();

  const tbody = document.getElementById('del-tbody');
  if (!pageJobs.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-row">沒有待刪除的職缺 🎉</td></tr>';
    return;
  }

  tbody.innerHTML = pageJobs.map(j => `
    <tr>
      <td><input type="checkbox" class="row-check" data-job-id="${escHtml(j.id)}" /></td>
      <td>${escHtml(j.title)}</td>
      <td>${escHtml(j.city || j.location || '—')}</td>
      <td>${j.job_type ? `<span class="tag-chip">${escHtml(TYPE_LABELS[j.job_type] ?? j.job_type)}</span>` : '—'}</td>
      <td class="deleted-at">${formatDeletedAt(j.deleted_at)}</td>
      <td>
        <button class="btn-restore" data-job-id="${escHtml(j.id)}" title="還原職缺">還原</button>
      </td>
      <td>
        <button class="btn-purge" data-job-id="${escHtml(j.id)}" title="確認刪除">確認刪除</button>
      </td>
    </tr>
  `).join('');

  document.querySelectorAll('.row-check').forEach(cb => cb.addEventListener('change', updateDeleteBtn));

  document.querySelectorAll('.btn-restore').forEach(btn => {
    btn.addEventListener('click', async () => {
      const jobId = btn.dataset.jobId;
      await fetch(`/api/jobs/${jobId}/restore`, { method: 'POST' });
      allJobs = allJobs.filter(j => j.id !== jobId);
      if (page > Math.max(1, Math.ceil(allJobs.length / PER_PAGE))) page--;
      renderTable();
    });
  });

  document.querySelectorAll('.btn-purge').forEach(btn => {
    btn.addEventListener('click', () => {
      const jobId = btn.dataset.jobId;
      confirmAndPurge([jobId]);
    });
  });
}

// ── Modal ──────────────────────────────────────────────────────────────────────
let _cb = null;
function showModal(hint, cb) {
  document.getElementById('modal-hint').textContent = hint || '';
  _cb = cb;
  document.getElementById('modal-overlay').classList.add('show');
}
document.getElementById('modal-yes').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  if (_cb) { _cb(); _cb = null; }
});
document.getElementById('modal-noo').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  _cb = null;
});

// ── Purge (confirm delete) ─────────────────────────────────────────────────────
async function confirmAndPurge(ids) {
  showModal(`確認刪除 ${ids.length} 筆職缺？刪除後將在一個月後自動清除。`, async () => {
    await fetch('/api/jobs/purge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_ids: ids }),
    });
    const purgedSet = new Set(ids);
    allJobs = allJobs.filter(j => !purgedSet.has(j.id));
    if (page > Math.max(1, Math.ceil(allJobs.length / PER_PAGE))) page--;
    renderTable();
  });
}

document.getElementById('btn-confirm-delete').addEventListener('click', () => {
  const ids = selectedIds();
  if (ids.length) confirmAndPurge(ids);
});

document.getElementById('select-all').addEventListener('change', function() {
  document.querySelectorAll('.row-check').forEach(cb => { cb.checked = this.checked; });
  updateDeleteBtn();
});

document.getElementById('btn-prev').addEventListener('click', () => { page--; renderTable(); });
document.getElementById('btn-next').addEventListener('click', () => { page++; renderTable(); });

async function init() {
  allJobs = await fetch('/api/jobs/deleted').then(r => r.json());
  renderTable();
}
init();
</script>

</body>
</html>
