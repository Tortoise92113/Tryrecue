        '<span class="tag">'+tl+'</span>'+
        '<span class="tag">'+j.source+'</span>'+
        (reg?'<span class="tag">'+reg+'</span>':'')+
        (uu?'<span class="tag">'+uu+'</span>':'')+
      '</div>'+
      (j.classifier_note?'<div class="note">'+j.classifier_note+'</div>':'')+
    '</div>';
  }).join('');
}
render();
</script>
</body>
</html>
